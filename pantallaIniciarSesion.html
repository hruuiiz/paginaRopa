<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="alternate stylesheet" href="css/alto-contraste.css" title="Alto Contraste">
  </head>
  <body>
    <div class="containerCuenta">
      <header><img src="img/iconoUsuarios.png" alt="Usuario" />
      <button id="btnContraste" class="btn-contraste" title="Cambiar contraste">ALTO CONTRASTE</button>
      </header>
      <main>
        <h2>INICIAR SESIÓN</h2>
        <form action="">
          <div>
            <label for="correoIniciarSesion">Correo electrónico:</label>
            <input
              type="email"
              name="correoIniciarSesion"
              id="correoIniciarSesion"
            />
          </div>
          <div>
            <label for="contrasenaIniciarSesion">Contraseña:</label>
            <input
              type="password"
              name="contrasenaIniciarSesion"
              id="contrasenaIniciarSesion"
            />
          </div>
          <div>
            <span>¿No tienes cuenta?</span>
            <a href="pantallaRegistrarse.html">Registrarse</a>
          </div>
          <button type="submit" class="btn" id="botonIniciarSesion">
            Iniciar sesión
          </button>
        </form>
      </main>
    </div>
    <script>
    const boton = document.getElementById('btnContraste');
    const hojaAlternativa = document.querySelector('link[title="Alto Contraste"]');

    if (boton && hojaAlternativa) {
      hojaAlternativa.disabled = true;

      boton.addEventListener('click', () => {
        hojaAlternativa.disabled = !hojaAlternativa.disabled;
      });
    }
  </script>
  </body>
  
</html>
