<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/iconoTiendaSostenible.png">
    <title>Solicitud Intercambio</title>
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="alternate stylesheet" href="css/alto-contraste.css" title="Alto Contraste">
</head>

<body>
    <div class="container">
        <header>
      <div class="containerHeader">
        <a href="pantallaPrincipal.html">
          <img src="img/iconoTiendaSostenible.png" alt="Logo tienda Tesoros con Historia">
        </a>
        <nav id="menuPrincipal">
          <ul>
            <li><a href="pantallaPrincipal.html">INICIO</a></li>
            <li><a href="pantallaComprar.html">COMPRAR</a></li>
            <li><a href="pantallaIntercambio.html">INTERCAMBIO</a></li>
            <li><a href="pantallaDonacion.html">DONACIÓN</a></li>
            <li><a href="pantallaMensajes.html">MENSAJES</a></li>
          </ul>
        </nav>
        <div class="iconos">
          <a href="pantallaIniciarSesion.html"><img src="img/iconoUsuarios.png" alt="Iniciar sesión/Registrarse"></a>
          <a href=""><img src="img/iconoBusqueda.png" alt="Buscar"></a>
          <a href="pantallaCarrito.html"><img src="img/iconoCarrito.png" alt="Carrito"></a>
          <button id="btnContraste" class="btn-contraste" title="Cambiar contraste">ALTO CONTRASTE</button>
        </div>
      </div>
    </header>
        <main class="containerSolicIntercambio">
            <section class="seccionPantallas">
                <h3>INTERCAMBIO</h3>
                <nav class="breadcrumb">
                    <a href="pantallaPrincipal.html">Inicio</a> >
                    <a href="pantallaIntercambio.html">Intercambio</a> >
                    <span>Solicitud</span>
                </nav>
                <div class="tarjetaSolicIntercambio">
                    <div class="imagenSolicIntercambio">
                        <img src="img/camisetaHazard.jpg" alt="Foto producto intercambio">
                    </div>
                    <div class="datosIntercambio">
                        <h2>Solicitud de intercambio</h2>
                        <div class="contenidoSolicIntercambio">
                            <section class="botonesIntercambio">
                                <button class="btn">Contactar</button>
                                <button class="btn">Aceptar Intercambio</button>
                            </section>
                            <section class="infoIntercambio">
                                <p>Camiseta del futbolistas Eden Hazard de la temporada 2012/2013</p>
                                <p>Talla L</p>
                                <p>60€</p>
                            </section>
                        </div>
                    </div>
                </div>
            </section>
        </main>
        <footer>
            <div class="containerFooter">
                <div class="suscripcion">
                    <p>¡SUSCRIBETE!</p>
                    <form action="">
                        <label><input type="email" name="email" id="email"
                                placeholder="Tu correo electrónico..." /></label>
                        <button type="button" class="btn" id="botonSuscribirse">
                            Suscribirse
                        </button>
                    </form>
                </div>
                <div class="redesSociales">
                    <p>REDES SOCIALES</p>
                    <div class="imgRedesSociales">
                        <a href=""><img src="img/iconoInstagram.png" alt="Instagram" /></a>
                        <a href=""><img src="img/iconoTiktok.png" alt="Tik tok" /></a>
                        <a href=""><img src="img/iconoTwitter.png" alt="Twitter" /></a>
                    </div>
                </div>
            </div>
        </footer>
    </div>
    <script>
    const boton = document.getElementById('btnContraste');
    const hojaAlternativa = document.querySelector('link[title="Alto Contraste"]');

    if (boton && hojaAlternativa) {
      hojaAlternativa.disabled = true;

      boton.addEventListener('click', () => {
        hojaAlternativa.disabled = !hojaAlternativa.disabled;
      });
    }
  </script>
</body>

</html>
