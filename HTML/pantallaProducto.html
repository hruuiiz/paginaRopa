<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../img/iconoTiendaSostenible.png">
    <title>Producto</title>
</head>
<body>
    <div class="container">
    <header>
            <div class="containerHeader">
                <a href="pantallaPrincipal.html">
                  <img src="../img/iconoTiendaSostenible.png" alt="Logo tienda Tesoros con Historia">
                </a>
                <nav id="menuPrincipal">
                    <ul>
                        <li><a href="pantallaPrincipal.html">INICIO</a></li>
                        <li><a href="pantallaComprar.html">COMPRAR</a></li>
                        <li><a href="pantallaIntercambio.html">INTERCAMBIO</a></li>
                        <li><a href="pantallaDonacion.html">DONACIÓN</a></li>
                        <li><a href="pantallaMensajes.html">MENSAJES</a></li>
                    </ul>
                </nav>
                <div class="iconos">
                    <a href="pantallaIniciarSesion.html"><img src="../img/iconoUsuarios.png" alt="Iniciar sesión/Registrarse"></a>
                    <a href=""><img src="../img/iconoBusqueda.png" alt="Buscar"></a>
                    <a href="pantallaCarrito.html"><img src="../img/iconoCarrito.png" alt="Carrito"></a>
                </div>
            </div>
        </header>
    <main class="containterProducto">
        <div class="imagenProducto">
            <img src="../img/productoGabardina.jpg" alt="Producto">
        </div>
        <div class="datosProducto">
            <p>Abrigo largo negro.</p>
            <p>50€</p>
            <div class="selectorTallas">
                <p>Tallas: </p>
                <label><input type="radio" id="talla-xs" name="talla">XS</label>

                <label><input type="radio" id="talla-s" name="talla">S</label>

                <label><input type="radio" id="talla-m" name="talla">M</label>

                <label><input type="radio" id="talla-l" name="talla">L</label>

                <label><input type="radio" id="talla-xl" name="talla">XL</label>
            </div>
            <div class="botonesProducto">
                <button type="button" class="btn">Añadir al carrito</button>
                <button type="button" class="btn">Comprar</button>
            </div>
        </div>
    </main>
    <footer>
      <div class="containerFooter">
        <div class="suscripcion">
          <p>¡SUSCRIBETE!</p>
          <form action="">
            <label><input type="email" name="email" id="email" placeholder="Tu correo electrónico..."/></label>
            <button type="button" class="btn" id="botonSuscribirse">
              Suscribirse
            </button>
          </form>
        </div>
        <div class="redesSociales">
          <p>REDES SOCIALES</p>
          <a href=""><img src="../img/iconoInstagram.png" alt="Instagram" /></a>
          <a href=""><img src="../img/iconoTiktok.png" alt="Tik tok" /></a>
          <a href=""><img src="../img/iconoTwitter.png" alt="Twitter" /></a>
        </div>
      </div>
    </footer>
    </div>
</body>
</html>
