<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <header><img src="../img/iconoUsuarios.jpg" alt="Usuario" /></header>
      <main>
        <h2>INICIAR SESIÓN</h2>
        <form action="">
          <div>
            <label for="correoIniciarSesion">Correo electrónico:</label>
            <input
              type="email"
              name="correoIniciarSesion"
              id="correoIniciarSesion"
            />
          </div>
          <div>
            <label for="contrasenaIniciarSesion">Contraseña:</label>
            <input
              type="password"
              name="contrasenaIniciarSesion"
              id="contrasenaIniciarSesion"
            />
          </div>
          <div>
            <span>¿No tienes cuenta?</span>
            <a href="pantallaRegistrarse.html">Registrarse</a>
          </div>
          <button type="submit" class="btn" id="botonIniciarSesion">
            Iniciar sesión
          </button>
        </form>
      </main>
    </div>
  </body>
</html>
