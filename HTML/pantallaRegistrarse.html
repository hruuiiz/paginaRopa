<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <header><img src="../img/iconoUsuarios.jpg" alt=""></header>
    <main>
      <h2>REGISTRO</h2>
      <form action="">
        <div>
          <label for="correoRegistro">Correo electrónico:</label>
          <input type="email" name="correoRegistro" id="correoRegistro" />
        </div>
        <div>
          <label for="nombreUsuario">Nombre de usuario:</label>
          <input type="text" name="nombreUsuario" id="nombreUsuario" />
        </div>
        <div>
          <label for="contrasenaRegistro">Contraseña:</label>
          <input
            type="password"
            name="contrasenaRegistro"
            id="contrasenaRegistro"
          />
        </div>
        <div>
          <label for="repetirContrasena">Repetir contraseña:</label>
          <input
            type="password"
            name="repetirContrasena"
            id="repetirContrasena"
          />
        </div>
        <button type="submit">Confirmar datos</button>
      </form>
    </main>
  </body>
</html>
