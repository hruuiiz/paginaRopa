<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90" width="90" height="90" role="img" aria-labelledby="titulo">
  <title id="titulo">Tesoros con Historia</title>

  <!-- Círculo de fondo (beige de la paleta) -->
  <circle cx="45" cy="45" r="40" fill="#F5F5DC" stroke="#1F5F3B" stroke-width="4"/>

  <!-- Percha: gancho + cuerpo triangular -->
  <line x1="45" y1="22" x2="45" y2="32" stroke="#1F5F3B" stroke-width="4" stroke-linecap="round"/>
  <circle cx="45" cy="20" r="4" fill="none" stroke="#1F5F3B" stroke-width="3"/>
  <polygon points="45,32 18,56 72,56" fill="none" stroke="#1F5F3B" stroke-width="4" stroke-linejoin="round"/>
  <rect x="18" y="55" width="54" height="4" rx="2" fill="#1F5F3B"/>

  <!-- Hoja (sostenibilidad) -->
  <polygon points="36,78 37,70 41,65 48,62 55,61 54,68 50,74 43,77" fill="#2E8B57"/>
  <line x1="37" y1="77" x2="52" y2="64" stroke="#F5F5DC" stroke-width="1.5" stroke-linecap="round"/>

</svg>
